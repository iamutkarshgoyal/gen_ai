[project]
name = "langraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Utkarsh Goyal", email = "utogoyal.ug@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "db>=0.1.1",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "graphviz>=0.21",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.4.0",
    "langchain-llama>=0.1.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "ollama>=0.6.2",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "regex>=2026.9.10",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.54.0",
]

[project.scripts]
langraph = "langraph:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false
